name: Release für BRAT
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen
        id: v
        run: echo "ver=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Release anlegen/aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.v.outputs.ver }}
          gh release view "$V" >/dev/null 2>&1 && gh release delete "$V" -y --cleanup-tag || true
          gh release create "$V" manifest.json main.js styles.css --title "$V" --notes "Jarvis Voice $V" --target "$GITHUB_SHA"
